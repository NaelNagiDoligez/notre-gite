name: Keepalive Supabase

# Évite que le projet Supabase (plan gratuit) passe en pause après ~1 semaine
# sans activité : une petite lecture de la table `docs` tous les 5 jours.
# Lancement manuel possible : onglet Actions > Keepalive Supabase > Run workflow.
#
# ⚠️ GitHub désactive les workflows planifiés d'un dépôt public après 60 jours
# sans aucune activité (push). Si c'est le cas : onglet Actions > réactiver.

on:
  schedule:
    - cron: '17 6 */5 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lire la table docs via l'API REST de Supabase
        run: |
          URL=$(sed -n "s/.*url: *'\([^']*\)'.*/\1/p" config.js)
          KEY=$(sed -n "s/.*key: *'\([^']*\)'.*/\1/p" config.js)
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "URL ou clé introuvable dans config.js" >&2
            exit 1
          fi
          CODE=$(curl -sS -o /dev/null -w '%{http_code}' \
            "$URL/rest/v1/docs?select=path&limit=1" \
            -H "apikey: $KEY" \
            -H "Authorization: Bearer $KEY")
          echo "Réponse Supabase : HTTP $CODE"
          case "$CODE" in
            2??) echo "Projet actif ✓" ;;
            *) echo "Échec du keepalive (HTTP $CODE)" >&2; exit 1 ;;
          esac
